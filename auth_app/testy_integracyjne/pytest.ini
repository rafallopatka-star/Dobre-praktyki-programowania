[pytest]
# Konfiguracja pytest dla testów integracyjnych

# Ścieżki do testów
testpaths = .

# Wzorzec nazw plików testowych
python_files = test_*.py

# Wzorzec nazw klas testowych
python_classes = Test*

# Wzorzec nazw funkcji testowych
python_functions = test_*

# Opcje domyślne
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markery
markers =
    integration: Testy integracyjne
    auth: Testy uwierzytelniania
    security: Testy bezpieczeństwa
    admin: Testy funkcjonalności admina
